<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>当前离线 · FitCoach</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(150deg, #eff6ff 0%, #eef2ff 45%, #ecfdf5 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      box-shadow: 0 24px 60px -20px rgba(30, 64, 175, 0.25);
      padding: 44px 32px 36px;
      text-align: center;
    }
    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #1d4ed8 0%, #3730a3 50%, #0f766e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 12px 30px -8px rgba(55, 48, 163, 0.5);
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.01em; }
    p { font-size: 14px; line-height: 1.75; color: #475569; margin-bottom: 8px; }
    .tip {
      margin: 18px 0 26px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 12.5px;
      line-height: 1.7;
      text-align: left;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button, a.btn {
      display: block;
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    button:active, a.btn:active { transform: scale(0.98); }
    button.primary {
      background: linear-gradient(135deg, #2563eb, #0d9488);
      color: #fff;
      box-shadow: 0 10px 24px -10px rgba(37, 99, 235, 0.6);
    }
    a.btn.secondary {
      background: #f1f5f9;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📡</div>
    <h1>当前处于离线状态</h1>
    <p>网络连接已中断，暂时无法打开未缓存的页面。</p>
    <div class="tip">
      💡 已在线访问过的页面会被自动缓存；AI 姿态识别所用模型在首次加载后也保存在本地，联网恢复前仍可尝试继续训练。
    </div>
    <div class="actions">
      <button class="primary" onclick="location.reload()">重新连接</button>
      <a class="btn secondary" href="/">返回首页</a>
    </div>
  </div>
</body>
</html>
